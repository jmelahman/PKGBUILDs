name: Hourly Updates

on:
  schedule:
    - cron: "0 * * * *"
  push:
    branches:
      - master
  workflow_dispatch:

# This workflow pushes branches and opens PRs, so overlapping runs race each
# other. Every push to master triggers it, so a batch of merges can otherwise
# stampede dozens of concurrent runs. cancel-in-progress is false deliberately:
# a run that is midway through `git push` / `gh pr create` must be allowed to
# finish, or it can leave a branch pushed with no PR behind it. GitHub keeps at
# most one pending run per group and discards older pending ones, so the
# stampede collapses to a single queued run without ever interrupting work in
# flight.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  run-command:
    runs-on: ubuntu-latest
    # makepkg and updpkgsums are Arch-only.
    container: archlinux:base-devel
    environment:
      name: nightly
    permissions:
      contents: write
      pull-requests: write
    steps:
      - run: pacman -Syu --noconfirm --needed git github-cli pacman-contrib python-uv
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.PAT }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - uses: ./.github/actions/build-user
      - run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN is empty; nvchecker would be rate limited without it"
            exit 1
          fi
          cat >"$RUNNER_TEMP/release.sh" <<'SCRIPT'
          set -u
          FAILED=0
          for dir in */; do
            PACKAGE="${dir%/}"
            [[ "$PACKAGE" =~ ^[a-zA-Z0-9_-]+$ ]] || { echo "Invalid input"; exit 1; }
            echo "Checking package: $PACKAGE"
            if ! MESSAGE=$(uv run ./pkgreleaser.py "$PACKAGE"); then
              echo "::error::pkgreleaser failed for $PACKAGE"
              FAILED=1
              continue
            fi
            [ -n "$MESSAGE" ] || continue
            VERSION=$(echo "$MESSAGE" | grep -oP '\b[0-9]+\.[0-9]+\.[0-9]+$') || true
            if [ -z "$VERSION" ]; then
              echo "::warning::Could not extract version from: $MESSAGE"
              continue
            fi
            BRANCH="pkgreleaser/$PACKAGE/$VERSION"
            if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
              continue
            fi
            git checkout -b "$BRANCH" origin/master
            git commit -am "$MESSAGE"
            git push -f -u origin "$BRANCH"
            gh pr create --base master --head "$BRANCH" --fill
            gh pr merge --auto --squash "$BRANCH"
          done
          exit "$FAILED"
          SCRIPT
          # makepkg refuses to run as root; sudo resets HOME to the build user's.
          sudo -u builder --preserve-env=GITHUB_TOKEN bash "$RUNNER_TEMP/release.sh"
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
